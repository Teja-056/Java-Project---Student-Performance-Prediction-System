# Application Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL Database DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_performance?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Teja.J@2007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Multipart / File Upload Configuration for Excel and Syllabus PDFs
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# JSON Serialization Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

# Logging Configuration
logging.level.studentperformance=INFO
logging.level.org.springframework.web=INFO
